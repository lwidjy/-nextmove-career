<script>
'use strict';
const KEY='nextmove:career:v1';
const NAV=[['home','Home','⌂'],['resume','Resume','▤'],['jobs','Jobs','▦'],['practice','Practice','◎'],['tools','Tools','✦']];
const STATUS=['Saved','Applied','Interview','Offer','Rejected'];
const questions={
 General:[['Tell me about yourself.','Try Present → Past → Future: who you are, what you have done, and why this role interests you.'],['Why do you want this internship?','Connect one real example from your experience to the role and its responsibilities.'],['What are your greatest strengths?','Pick a skill and support it with a specific, truthful example.'],['What is one area you are working to improve?','Choose a real weakness and explain the steps you are taking.'],['Why should we hire you?','Emphasize relevant abilities and eagerness to learn without inventing experience.'],['Where do you see yourself in five years?','Talk about skills and growth, not a job title you must promise.'],['What do you know about our organization?','Research the employer first; use facts from its website.'],['What questions do you have for us?','Ask about projects, mentorship, team collaboration, or success in the role.']],
 Behavioral:[['Tell me about a time you handled a difficult deadline.','Use STAR: Situation, Task, Action, Result. Focus on what you actually did.'],['Describe a time you worked on a team.','Give a real group example and your individual contribution.'],['Tell me about a mistake and what you learned.','Own the mistake and explain how you improved.'],['Describe a time you solved a problem creatively.','Show your steps, reasoning, and measurable result if you have one.'],['Tell me about a disagreement with a colleague.','Keep it respectful; explain how you listened and found a solution.'],['Share an example of taking initiative.','Describe a real moment you acted without being asked.'],['How do you prioritize when everything feels urgent?','Explain how you weigh deadlines, impact, and communication.'],['Tell me about feedback that changed your approach.','Explain what you changed afterward rather than just what you heard.']],
 Accounting:[['What is the difference between accounts payable and accounts receivable?','Explain who owes whom, with a simple example for each.'],['Walk me through the three financial statements.','Balance sheet: position; income statement: performance; cash flow: cash movements.'],['What is the accounting equation?','Assets = Liabilities + Equity. Give a concrete example.'],['What is the difference between cash and accrual accounting?','Focus on when revenue and expenses are recognized.'],['Why are you interested in audit or tax?','Be genuine about what interests you, and note what you still want to learn.'],['What is a bank reconciliation?','Explain comparing records to bank transactions and investigating differences.'],['How do you catch an error in a spreadsheet?','Think cross-checks, formulas, source documents, and peer review.'],['How would you handle confidential financial information?','Mention authorized access, secure handling, and escalation when uncertain.']],
 Business:[['Explain a time you improved a process.','Describe the original problem, your change, and the outcome.'],['How would you help an unhappy customer?','Listen, clarify, own your part, and seek a solution.'],['How do you stay organized on multiple tasks?','Describe the actual calendar or task system you use.'],['What metrics would you use to measure success?','Choose measures that fit the job, like quality, time, or satisfaction.'],['How would you approach an unfamiliar problem?','Clarify the goal, gather facts, test options, and request help as needed.'],['Pitch an idea to someone skeptical.','Lead with the problem, evidence, tradeoffs, and a clear ask.']],
 Tech:[['Walk me through a project you built.','State the problem, your role, technologies used, and what you learned.'],['How do you debug an issue?','Reproduce it, isolate causes, test fixes, and prevent regressions.'],['How do you learn a tool you have never used?','Describe documentation, practice, small projects, and feedback.'],['What is a technical challenge you overcame?','Be precise about your decisions, mistakes, and outcome.'],['How do you make your projects accessible?','Mention keyboard navigation, labels, contrast, and screen-reader basics.'],['How do you handle user data responsibly?','Describe minimizing data, safeguarding it, and honest disclosures.']]
};
const fresh=()=>({version:1,profile:{name:'',email:'',phone:'',location:'',linkedin:'',targetRole:'',summary:'',school:'',degree:'',graduation:'',skills:'',experience:[],projects:[]},jobs:[],practice:[],cover:{company:'',position:'',why:'',strength:''}});
let state=fresh(),view='home',jobFilter='All',editJob=null,category='General',questionIndex=0,seconds=90,running=false,ticker=null,showTip=false,letterResult='',toastTimer;
const id=()=>globalThis.crypto?.randomUUID?.()||'id_'+Date.now()+'_'+Math.random().toString(36).slice(2);
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeHref=(v)=>{try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}};
const simpleDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
const options=(arr,chosen)=>arr.map(v=>`<option value="${esc(v)}" ${v===chosen?'selected':''}>${esc(v)}</option>`).join('');
const p=state.profile;
try{const raw=localStorage.getItem(KEY);if(raw){const x=JSON.parse(raw);if(x&&x.version===1&&x.profile&&Array.isArray(x.jobs)&&Array.isArray(x.practice)){state={...fresh(),...x,profile:{...fresh().profile,...x.profile},cover:{...fresh().cover,...x.cover}};state.profile.experience=Array.isArray(x.profile.experience)?x.profile.experience:[];state.profile.projects=Array.isArray(x.profile.projects)?x.profile.projects:[];}}}catch(e){console.warn('Saved data unreadable; not overwriting until user edits',e);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Could not save — check browser storage space')}}
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),3100)}
function navi(){['desktopNav','mobileNav'].forEach(id=>document.getElementById(id).innerHTML=NAV.map(([key,label,icon])=>`<button data-nav="${key}" type="button" aria-current="${key===view?'page':'false'}"><span class="ico" aria-hidden="true">${icon}</span><span>${label}</span></button>`).join(''))}
function go(to){if(!NAV.some(n=>n[0]===to))return; if(to!=='practice')timerPause();view=to;navi();document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id===to+'View'));render();window.scrollTo({top:0,behavior:'instant'});}
function btn(to,label='Open →',cl='secondary'){return `<button class="btn ${cl}" type="button" data-nav="${to}">${esc(label)}</button>`}
function heading(eyebrow,h,sub,id){return `<div class="intro"><div class="eyebrow">${esc(eyebrow)}</div><h1 class="title" id="${id}">${h}</h1><p class="muted lede">${esc(sub)}</p></div>`}
function metric(label,val,unit){return `<div class="card stat"><div class="tag">${label}</div><div class="num">${val}</div><b>${unit}</b></div>`}
function renderHome(){const c=state.jobs.reduce((a,j)=>(a[j.status]=(a[j.status]||0)+1,a),{});const fill=['name','email','school','degree','skills','summary','experience'].reduce((n,k)=>n+(k==='experience'?Number(state.profile.experience.length>0):Number(Boolean(state.profile[k]?.trim()))),0);const progress=Math.round(fill/7*100);
document.getElementById('homeView').innerHTML=`<div class="hero"><div class="hero-copy"><div class="eyebrow">YOUR FUTURE. YOUR MOVE.</div><h1 class="title" id="homeHeading">Small steps.<br><em>Big opportunities.</em></h1><p class="muted">Build a resume you’re proud of. Track every opportunity. Practice the questions that matter. All in one place.</p><div class="hero-buttons">${btn('resume','Build my resume ↗','primary')}${btn('jobs','Track applications →')}</div></div><div class="hero-art"><span class="art-pill">✦ YOUR CAREER, YOUR PACE</span><div class="art-main">Nobody starts with experience. Everyone starts somewhere.</div><div class="art-bottom">Your next move starts today →</div></div></div>
<div class="grid stats">${metric('Your applications',state.jobs.length,'Total tracked')}${metric('Interviews lined up',c.Interview||0,'In progress')}${metric('Resume complete',progress+'%','Keep building')}</div>
<div class="sectionhead"><div><h2>Get started in 3 steps</h2><p>No subscription. No complicated setup.</p></div><span class="chip">START HERE</span></div><div class="grid steps"><div class="card step"><div class="stepicon">1</div><div><strong>Make your resume</strong><p>Add your real experience and download a clean, printable version.</p><div style="margin-top:12px">${btn('resume','Build resume','secondary')}</div></div></div><div class="card step"><div class="stepicon">2</div><div><strong>Track your applications</strong><p>Organize jobs, companies, links, statuses, and follow-ups.</p><div style="margin-top:12px">${btn('jobs','Open tracker','secondary')}</div></div></div><div class="card step"><div class="stepicon">3</div><div><strong>Practice answering</strong><p>Interview prompts, helpful tips, and a 90-second timer.</p><div style="margin-top:12px">${btn('practice','Practice now','secondary')}</div></div></div></div><div class="sectionhead"><div><h2>A toolkit, not a subscription trap.</h2><p>Save your career info locally in your browser.</p></div></div><div class="card"><div class="actions" style="justify-content:space-between"><div><h3 style="margin-bottom:4px">Keep control of your work</h3><p class="hint" style="margin:0">You can export a backup anytime. Your private info is not uploaded to our servers.</p></div>${btn('tools','Backup & tools')}</div></div>`}
const fields=[['name','Full name','e.g. Alex Morgan'],['email','Email','alex@example.com'],['phone','Phone','(555) 555-5555'],['location','Location','City, state'],['linkedin','LinkedIn URL','https://linkedin.com/in/...'],['targetRole','Target role','Accounting intern'],['school','School','College or university'],['degree','Degree / major','B.S. in Accounting'],['graduation','Graduation date','Expected May 2028'],['skills','Skills (comma-separated)','Excel, teamwork, customer service']];
function field(key,label,placeholder,which='profile'){return `<div class="field"><label for="f-${which}-${key}">${esc(label)}</label><input id="f-${which}-${key}" data-bind="${which}.${key}" autocomplete="off" placeholder="${esc(placeholder)}" value="${esc(state[which]?.[key])}"></div>`}
function resumeMarkup(){const u=state.profile;const parts=[u.email,u.phone,u.location,u.linkedin?u.linkedin.replace(/^https?:\/\//,''):''].filter(Boolean).map(esc).join(' · ');return `<div class="resume-sheet" id="printArea"><h2>${esc(u.name||'YOUR NAME')}</h2><div class="contact">${parts||'Email · Phone · City, State · LinkedIn'}</div>${u.summary?`<h3>Professional summary</h3><p>${esc(u.summary)}</p>`:''}${u.school||u.degree?`<h3>Education</h3><div class="itemline"><b>${esc(u.school||'University')}</b><span>${esc(u.graduation)}</span></div><p>${esc(u.degree)}</p>`:''}${u.experience.length?`<h3>Experience</h3>${u.experience.map(x=>`<div style="margin-top:9px"><div class="itemline"><b>${esc(x.role)}</b><span>${esc(x.period)}</span></div><p style="font-weight:650">${esc(x.company)}</p><ul>${(x.bullets||'').split(/\n/).map(x=>x.trim().replace(/^[-•]\s*/,'' )).filter(Boolean).map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>`).join('')}`:''}${u.projects?.length?`<h3>Projects</h3>${u.projects.map(x=>`<div style="margin-top:9px"><div class="itemline"><b>${esc(x.name)}</b></div><p>${esc(x.details)}</p></div>`).join('')}`:''}${u.skills?`<h3>Skills</h3><p>${esc(u.skills)}</p>`:''}${!u.name&&!u.summary&&!u.school&&!u.experience.length?`<h3>Welcome to your resume</h3><p>Start filling in the fields on the left. Your professional resume preview will appear here as you type. Be accurate — only include experience and skills you actually have.</p>`:''}</div>`}
function expCard(x,i){return `<div class="expbox"><div class="exphead"><strong>Experience ${i+1}</strong><button class="btn danger small" type="button" data-remove-exp="${esc(x.id)}">Remove</button></div><div class="row2">${expField(x,'role','Job title','Student Assistant')}${expField(x,'company','Employer','Your company')}</div>${expField(x,'period','Dates','Jan 2025 – Present')}<div class="field"><label for="exp-b-${esc(x.id)}">Accomplishments (one bullet per line)</label><textarea id="exp-b-${esc(x.id)}" data-exp="${esc(x.id)}" data-exp-field="bullets" rows="4" placeholder="Helped 15 students each day with enrollment questions">${esc(x.bullets)}</textarea><p class="hint" style="margin:0">Use real actions and numbers. Never make up responsibilities or results.</p></div></div>`}
function expField(x,k,label,ph){return `<div class="field"><label for="exp-${k}-${esc(x.id)}">${label}</label><input id="exp-${k}-${esc(x.id)}" data-exp="${esc(x.id)}" data-exp-field="${k}" placeholder="${esc(ph)}" value="${esc(x[k])}"></div>`}
function projectCard(x,i){return `<div class="expbox"><div class="exphead"><strong>Project ${i+1}</strong><button class="btn danger small" data-remove-project="${esc(x.id)}">Remove</button></div><div class="field"><label for="projname-${esc(x.id)}">Project name</label><input id="projname-${esc(x.id)}" data-project="${esc(x.id)}" data-project-field="name" value="${esc(x.name)}" placeholder="Personal website"></div><div class="field"><label for="projdetail-${esc(x.id)}">What you built and achieved</label><textarea id="projdetail-${esc(x.id)}" data-project="${esc(x.id)}" data-project-field="details" rows="2">${esc(x.details)}</textarea></div></div>`}
function renderResume(){const u=state.profile;document.getElementById('resumeView').innerHTML=`${heading('01 / SHOW YOUR POTENTIAL','Build your <em>resume.</em>','You don’t need a perfect career history. Start with what you’ve actually done.','resumeHeading')}<div class="twocol"><div class="stack" id="resumeFormSide"><div class="card"><h3>Your contact details</h3><div class="row2">${fields.slice(0,4).map(x=>field(...x)).join('')}</div>${fields.slice(4,6).map(x=>field(...x)).join('')}</div><div class="card"><h3>Your introduction</h3><div class="field"><label for="summary">Professional summary</label><textarea id="summary" data-bind="profile.summary" placeholder="Motivated business student with experience helping customers and working on teams..." rows="4">${esc(u.summary)}</textarea></div><p class="hint">Write 2–3 truthful sentences. If you’re new to work, highlight school, projects, and skills.</p></div><div class="card"><h3>Education & skills</h3><div class="row2">${fields.slice(6,9).map(x=>field(...x)).join('')}</div>${field(...fields[9])}</div><div class="card"><div class="actions" style="justify-content:space-between;margin-bottom:12px"><h3 style="margin:0">Work experience</h3><button type="button" class="btn secondary small" data-action="addExp">+ Add experience</button></div><div id="expList">${u.experience.map(expCard).join('')||'<p class="hint">No experience added. School jobs, volunteering, and part-time roles count.</p>'}</div></div><div class="card"><div class="actions" style="justify-content:space-between;margin-bottom:12px"><h3 style="margin:0">Projects</h3><button type="button" class="btn secondary small" data-action="addProject">+ Add project</button></div><div id="projectList">${u.projects.map(projectCard).join('')||'<p class="hint">Add a class project, portfolio, app, or personal project.</p>'}</div></div></div><aside class="card sticky" id="resumePreviewSide"><div class="actions" style="justify-content:space-between;margin-bottom:14px"><h3 style="margin:0">Live resume preview</h3><span class="chip">PRINT-READY</span></div><p class="hint">To get a PDF on iPhone: tap “Print / Save PDF,” then use the print preview’s Share option to save it.</p><div class="actions" style="margin:13px 0 16px"><button class="btn primary" data-action="printResume">↗ Print / Save PDF</button></div><div class="resumescroll" id="resumePreview">${resumeMarkup()}</div></aside></div>`}
function statusStats(){return STATUS.map(s=>`<div class="tablelike"><span>${esc(s)}</span><strong>${state.jobs.filter(j=>j.status===s).length}</strong></div>`).join('')}
function jobCard(j){const href=safeHref(j.link);return `<article class="job"><div class="jobtop"><div><h3>${esc(j.role||'Untitled role')}</h3><p>${esc(j.company||'Company not entered')}</p></div><span class="status ${esc(j.status)}">${esc(j.status)}</span></div><div class="jobfoot"><span class="hint">${j.date?'Added '+esc(simpleDate(j.date)):'No date'}${href?` · <a href="${esc(href)}" target="_blank" rel="noopener noreferrer">Job link ↗</a>`:''}</span><div class="actions"><button class="btn secondary small" data-edit-job="${esc(j.id)}">Edit</button><button class="btn danger small" data-delete-job="${esc(j.id)}">Delete</button></div></div>${j.notes?`<div class="job-notes">${esc(j.notes)}</div>`:''}</article>`}
function renderJobs(){const display=state.jobs.filter(j=>jobFilter==='All'||j.status===jobFilter).sort((a,b)=>(b.date||'').localeCompare(a.date||''));const j=state.jobs.find(x=>x.id===editJob)||{};document.getElementById('jobsView').innerHTML=`${heading('02 / NEVER LOSE AN OPPORTUNITY','Your <em>application tracker.</em>','Keep every internship, interview, and application organized in one place.','jobsHeading')}<div class="twocol"><div class="stack"><div class="card"><div class="actions" style="justify-content:space-between"><h3 style="margin:0">${editJob?'Edit application':'Add an opportunity'}</h3><span class="chip">${state.jobs.length} SAVED</span></div><form id="jobForm" style="margin-top:16px"><div class="row2"><div class="field"><label for="jcompany">Company *</label><input id="jcompany" name="company" required maxlength="120" value="${esc(j.company||'')}" placeholder="Company name"></div><div class="field"><label for="jrole">Position *</label><input id="jrole" name="role" required maxlength="120" value="${esc(j.role||'')}" placeholder="Summer accounting intern"></div></div><div class="row2"><div class="field"><label for="jdate">Date added</label><input type="date" id="jdate" name="date" value="${esc(j.date||new Date().toISOString().slice(0,10))}"></div><div class="field"><label for="jstatus">Status</label><select name="status" id="jstatus">${options(STATUS,j.status||'Saved')}</select></div></div><div class="field"><label for="jlink">Job posting URL</label><input id="jlink" name="link" type="url" value="${esc(j.link||'')}" placeholder="https://..."></div><div class="field"><label for="jnotes">Notes / follow-up</label><textarea id="jnotes" name="notes" rows="3" placeholder="Recruiter name, deadlines, interview prep...">${esc(j.notes||'')}</textarea></div><div class="actions"><button class="btn primary" type="submit">${editJob?'Save changes':'Save application'} ↗</button>${editJob?'<button class="btn secondary" type="button" data-action="cancelJob">Cancel</button>':''}</div></form></div><div class="card"><h3>Pipeline overview</h3>${statusStats()}</div></div><div class="card"><div class="actions" style="justify-content:space-between;align-items:center;margin-bottom:18px"><h3 style="margin:0">My applications</h3><div class="field" style="margin:0"><label for="jobFilter" class="sr">Filter</label><select id="jobFilter" style="max-width:160px;padding:9px;color:#fff;background:#121e31;border:1px solid #44536b;border-radius:9px"><option value="All">All statuses</option>${options(STATUS,jobFilter)}</select></div></div><div class="apply-list">${display.length?display.map(jobCard).join(''):`<div class="emptystate"><div class="emoji">📂</div><h3>${state.jobs.length?'No jobs in this stage':'Your first opportunity goes here'}</h3><p>${state.jobs.length?'Try a different status filter.':'Add a company, job title, and status. This is your personal application board.'}</p></div>`}</div></div></div>`}
const getQ=()=>questions[category][questionIndex%questions[category].length];
function renderPractice(){const q=getQ();document.getElementById('practiceView').innerHTML=`${heading('03 / BUILD REAL CONFIDENCE','Practice. <em>Get ready.</em>','Real interview prompts and a simple practice timer. We won’t pretend to grade your voice with AI.','practiceHeading')}<div class="twocol"><div class="stack"><div class="card"><div class="field" style="margin:0"><label for="categorySelect">Choose your interview type</label><select id="categorySelect">${options(Object.keys(questions),category)}</select></div></div><div class="practicebox"><div class="questionnum">QUESTION ${(questionIndex%questions[category].length)+1} OF ${questions[category].length}</div><div class="bigquestion" id="questionText">${esc(q[0])}</div><div class="actions"><button class="btn secondary small" data-action="showTip">${showTip?'Hide tip':'Need a hint?'}</button><button class="btn secondary small" data-action="nextQ">Next question →</button></div>${showTip?`<div class="tip">💡 ${esc(q[1])}</div>`:''}<hr class="subtleline"><div class="actions" style="justify-content:space-between"><div><div class="hint">PRACTICE TIMER</div><div class="timer" id="timerLabel">${timeText(seconds)}</div></div><div class="actions"><button class="btn primary" type="button" data-action="toggleTimer" id="timerButton">${running?'Pause':'Start'} timer</button><button class="btn secondary small" type="button" data-action="resetTimer">Reset</button></div></div></div><div class="card"><h3>Write your answer notes</h3><div class="field"><label for="practiceNotes">Your key points</label><textarea id="practiceNotes" rows="5" placeholder="Situation → What I did → Result..."></textarea></div><div class="field"><label for="practiceRating">How did you feel about your answer?</label><select id="practiceRating">${options(['1 — Need more practice','2 — Getting started','3 — Okay','4 — Confident','5 — Nailed it'],'3 — Okay')}</select></div><button class="btn primary" type="button" data-action="savePractice">Save practice session ✓</button><p class="hint">Self-rated practice only — not an AI interview score.</p></div></div><aside class="stack"><div class="card"><h3>Your practice log</h3><div class="inline-stat">${state.practice.length} <span class="hint">sessions</span></div><hr class="subtleline"><div class="practice-history">${state.practice.length?state.practice.slice().reverse().slice(0,7).map(x=>`<div class="entry"><strong>${esc(x.question)}</strong><p>${esc(x.date)} · ${esc(x.category)} · ${x.rating}/5 confidence</p>${x.notes?`<p>${esc(x.notes)}</p>`:''}</div>`).join(''):'<p class="hint">Complete your first practice question to start a log.</p>'}</div></div><div class="card"><h3>Quick method: STAR</h3><p class="hint">Helpful for behavioral questions.</p>${[['S','Situation','What was happening?'],['T','Task','What was your responsibility?'],['A','Action','What did you actually do?'],['R','Result','What happened? What did you learn?']].map(x=>`<div class="feature"><strong>${x[0]} — ${x[1]}</strong><span>${x[2]}</span></div>`).join('')}</div></aside></div>`}
function timeText(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function timerPause(){running=false;clearInterval(ticker);ticker=null;const b=document.getElementById('timerButton');if(b)b.textContent='Start timer'}
function timerToggle(){if(running){timerPause();return}if(seconds===0)seconds=90;running=true;const b=document.getElementById('timerButton');if(b)b.textContent='Pause';ticker=setInterval(()=>{seconds=Math.max(0,seconds-1);const el=document.getElementById('timerLabel');if(el)el.textContent=timeText(seconds);if(seconds===0){timerPause();toast('Time! Review your answer.')}},1000)}
function generateLetter(){const u=state.profile,c=state.cover;const company=c.company.trim()||'[Company]';const position=c.position.trim()||'[Position]';const name=u.name.trim()||'[Your Name]';let lines=['Dear Hiring Manager,','',`I am writing to express my interest in the ${position} position at ${company}.`];if(u.school||u.degree)lines.push(`I am currently studying ${u.degree||'at college'}${u.school?' at '+u.school:''}${u.graduation?' ('+u.graduation+')':''}.`);if(c.why.trim())lines.push(`What interests me about this opportunity is ${c.why.trim().replace(/[.!?]+$/,'')}.`);if(c.strength.trim())lines.push(`I would bring ${c.strength.trim().replace(/[.!?]+$/,'')} to the team.`);else lines.push('I am eager to contribute, continue learning, and bring a strong work ethic to your team.');lines.push('','Thank you for your time and consideration. I would welcome the opportunity to discuss how I could contribute to your organization.','','Sincerely,',name);return lines.join('\n')}
function renderTools(){document.getElementById('toolsView').innerHTML=`${heading('04 / MORE THAN A RESUME','Your career <em>toolbox.</em>','Build a first-draft cover letter, export your data, and plan what to do next.','toolsHeading')}<div class="twocol"><div class="stack"><div class="card"><h3>Cover letter starter</h3><p class="hint">This creates an editable template using only details you enter. It does not use AI or research companies for you.</p><div class="row2">${field('company','Company name','Company name','cover')}${field('position','Job title','Internship title','cover')}</div><div class="field"><label for="cwhy">Why this company / role?</label><textarea id="cwhy" data-bind="cover.why" rows="3" placeholder="I enjoy problem solving and am excited by the chance to learn about audit...">${esc(state.cover.why)}</textarea></div><div class="field"><label for="cstrength">Strengths you can honestly support</label><textarea id="cstrength" data-bind="cover.strength" rows="3" placeholder="strong attention to detail and customer service experience...">${esc(state.cover.strength)}</textarea></div><button class="btn primary" data-action="makeLetter">Generate my draft ↗</button></div><div class="card"><h3>Draft preview</h3><p class="hint">Read and personalize before sending. The letter is not sent anywhere automatically.</p><div class="letterpaper" id="letterPaper">${esc(letterResult||'Fill in the fields above and tap “Generate my draft.”')}</div><div class="actions" style="margin-top:15px"><button class="btn secondary" data-action="copyLetter" ${letterResult?'':'disabled'}>Copy text</button><button class="btn secondary" data-action="downloadLetter" ${letterResult?'':'disabled'}>Download .txt</button></div></div></div><aside class="stack"><div class="card"><h3>Back up your progress</h3><p class="hint">Your information is saved locally in this browser. Switching phones, clearing Safari data, or moving to another website address does not automatically move your records.</p><div class="actions" style="margin:14px 0"><button class="btn primary" data-action="export">↓ Export backup</button><label class="btn secondary" for="importFile" tabindex="0">↑ Import backup</label></div><input type="file" id="importFile" accept=".json,application/json" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden"><p class="hint">Backups include personal details; keep the downloaded JSON file private.</p></div><div class="card"><h3>What’s free today?</h3>${[['✓','Resume builder','A clean, print-ready format'],['✓','Application tracker','Statuses, notes, and job links'],['✓','Interview practice','Questions, a timer, self-ratings'],['✓','Cover letter starter','Editable template, not fabricated AI'],['✓','Local save + export','No account required']].map(x=>`<div class="feature"><b>${x[0]} ${x[1]}</b><span>${x[2]}</span></div>`).join('')}</div><div class="card"><h3>Future upgrades (not available yet)</h3><p class="hint">We could eventually add cloud sync, more resume designs, and real AI feedback. We are <strong>not</strong> taking payments or claiming these features work today.</p></div><div class="card"><h3>Reset this device</h3><p class="hint">Export a backup first. Reset erases the data saved by NEXTMOVE on this browser.</p><button class="btn danger" data-action="resetAll">Reset all data</button></div></aside></div>`}
function render(){if(view==='home')renderHome();if(view==='resume')renderResume();if(view==='jobs')renderJobs();if(view==='practice')renderPractice();if(view==='tools')renderTools()}
function refreshPreview(){const el=document.getElementById('resumePreview');if(el)el.innerHTML=resumeMarkup()}
function download(text,name,mime){const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function profileBindings(e){const el=e.target;if(!(el instanceof HTMLInputElement||el instanceof HTMLTextAreaElement||el instanceof HTMLSelectElement))return;const b=el.dataset.bind;if(b){const [what,key]=b.split('.');if((what==='profile'||what==='cover')&&key in state[what]){state[what][key]=el.value;save();if(view==='resume')refreshPreview()}}const ei=el.dataset.exp;if(ei){const x=state.profile.experience.find(v=>v.id===ei);if(x){x[el.dataset.expField]=el.value;save();refreshPreview()}}const pi=el.dataset.project;if(pi){const x=state.profile.projects.find(v=>v.id===pi);if(x){x[el.dataset.projectField]=el.value;save();refreshPreview()}}}
function importData(file){if(!file)return;if(file.size>2_000_000){toast('Backup too large');return}file.text().then(txt=>{const obj=JSON.parse(txt);if(!obj||obj.version!==1||!obj.profile||!Array.isArray(obj.jobs)||!Array.isArray(obj.practice))throw Error('Invalid NEXTMOVE backup');if(!confirm('Importing will replace your current NEXTMOVE data. Continue?'))return;state={...fresh(),...obj,profile:{...fresh().profile,...obj.profile},cover:{...fresh().cover,...obj.cover}};state.profile.experience=Array.isArray(state.profile.experience)?state.profile.experience:[];state.profile.projects=Array.isArray(state.profile.projects)?state.profile.projects:[];save();render();toast('Backup restored!')}).catch(e=>toast('Import failed: '+e.message))}
function act(name){if(name==='addExp'){state.profile.experience.push({id:id(),role:'',company:'',period:'',bullets:''});save();renderResume();setTimeout(()=>document.querySelector('[data-exp-field="role"]')?.focus(),30)}
if(name==='addProject'){state.profile.projects.push({id:id(),name:'',details:''});save();renderResume()}
if(name==='printResume'){go('resume');window.print()}
if(name==='cancelJob'){editJob=null;renderJobs()}
if(name==='nextQ'){timerPause();seconds=90;questionIndex++;showTip=false;renderPractice()}
if(name==='showTip'){showTip=!showTip;renderPractice()}
if(name==='toggleTimer')timerToggle();if(name==='resetTimer'){timerPause();seconds=90;document.getElementById('timerLabel').textContent=timeText(seconds)}
if(name==='savePractice'){const notes=document.getElementById('practiceNotes').value.trim();const rating=Number(document.getElementById('practiceRating').value[0]);const q=getQ()[0];state.practice.push({id:id(),question:q,notes,rating,category,date:new Date().toLocaleDateString()});save();timerPause();seconds=90;questionIndex++;showTip=false;renderPractice();toast('Practice saved! Nice work.')}
if(name==='makeLetter'){letterResult=generateLetter();renderTools();toast('Draft ready — review before sending')}
if(name==='copyLetter'){if(!letterResult)return;const fallback=()=>{const t=document.createElement('textarea');t.value=letterResult;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Copied!')}catch{toast('Select and copy the draft above')}t.remove()};if(navigator.clipboard?.writeText)navigator.clipboard.writeText(letterResult).then(()=>toast('Copied!')).catch(fallback);else fallback()}
if(name==='downloadLetter'&&letterResult)download(letterResult,'NEXTMOVE-cover-letter.txt','text/plain;charset=utf-8');
if(name==='export'){download(JSON.stringify(state,null,2),'NEXTMOVE-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json');toast('Backup downloaded')}
if(name==='resetAll'){if(confirm('This deletes your NEXTMOVE data on this browser. Export a backup first. Are you sure?')){state=fresh();save();letterResult='';go('home');toast('Local NEXTMOVE data reset')}}
}
document.addEventListener('input',profileBindings);
document.addEventListener('change',e=>{if(e.target.id==='jobFilter'){jobFilter=e.target.value;renderJobs()}if(e.target.id==='categorySelect'){category=e.target.value;questionIndex=0;showTip=false;timerPause();seconds=90;renderPractice()}if(e.target.id==='importFile'){importData(e.target.files?.[0]);e.target.value=''}});
document.addEventListener('submit',e=>{if(e.target.id==='jobForm'){e.preventDefault();const f=new FormData(e.target);const j={id:editJob||id(),company:String(f.get('company')||'').trim(),role:String(f.get('role')||'').trim(),date:String(f.get('date')||''),status:String(f.get('status')||'Saved'),link:String(f.get('link')||'').trim(),notes:String(f.get('notes')||'').trim()};if(!j.company||!j.role){toast('Company and position are required');return}if(j.link&&!safeHref(j.link)){toast('Use a valid http or https link');return}const i=state.jobs.findIndex(x=>x.id===editJob);if(i>=0)state.jobs[i]=j;else state.jobs.push(j);editJob=null;save();renderJobs();toast('Opportunity saved!')}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-nav],[data-action],[data-remove-exp],[data-remove-project],[data-delete-job],[data-edit-job]');if(!el)return;if(el.dataset.nav){e.preventDefault();go(el.dataset.nav);return}if(el.dataset.action){act(el.dataset.action);return}if(el.dataset.removeExp){if(confirm('Remove this experience from your resume?')){state.profile.experience=state.profile.experience.filter(x=>x.id!==el.dataset.removeExp);save();renderResume()}}if(el.dataset.removeProject){if(confirm('Remove this project from your resume?')){state.profile.projects=state.profile.projects.filter(x=>x.id!==el.dataset.removeProject);save();renderResume()}}if(el.dataset.deleteJob){if(confirm('Delete this application?')){state.jobs=state.jobs.filter(j=>j.id!==el.dataset.deleteJob);if(editJob===el.dataset.deleteJob)editJob=null;save();renderJobs();toast('Application deleted')}}if(el.dataset.editJob){editJob=el.dataset.editJob;renderJobs();window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>document.getElementById('jcompany')?.focus(),80)}});
window.addEventListener('beforeunload',timerPause);
(function start(){navi();render();if(location.hash&&NAV.some(n=>n[0]===location.hash.slice(1)))go(location.hash.slice(1))})();
</script>
</body>
</html>
